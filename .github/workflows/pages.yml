name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 发布在线版
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 只发布运行所需的最小集合，不把源码 / 脚本 / README 暴露到站点根目录
      - name: 准备站点目录
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r icons _site/icons
          ls -la _site

      # enablement: true 会在 Pages 尚未开启时自动开启（Source 设为 GitHub Actions）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
