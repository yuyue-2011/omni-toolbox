name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 语法与交付终检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 这两个脚本只用 Node 内置模块，无需安装依赖
      - name: 全部 JS 语法检查
        run: node scripts/check.js

      - name: 交付前终检（版本 / 计数 / 文档 / 图标 / www 一致性）
        run: node scripts/release-check.js

  test:
    name: 渲染与交互测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 只需要 jsdom；跳过 electron / sharp 等重型 postinstall 下载
      - name: 安装测试依赖
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@^30

      - name: 校验依赖可解析
        run: node -e "console.log('jsdom ->', require.resolve('jsdom'))"

      - name: 冒烟测试（224 款工具渲染 / 26 分类 / 中英 / 明暗）
        run: |
          set -o pipefail
          node scripts/smoke-test.js 2>&1 | tee _smoke.log

      # 失败时把输出转成 annotation，便于在 API / 页面上定位具体失败行
      - name: 失败诊断
        if: failure()
        run: |
          echo "=== 冒烟输出（尾部 40 行）==="
          tail -n 40 _smoke.log 2>/dev/null | while IFS= read -r line; do echo "::error::$line"; done
          exit 1

      - name: 静态检查（注入 / id 冲突 / 注册一致性）
        run: node scripts/static-check.js

      - name: 重名与重复 id
        run: node scripts/dup-check.js

      - name: 双语词条覆盖
        run: node scripts/i18n-coverage-test.js

      - name: 站点去重与国内优先排序
        run: node scripts/sites-final-test.js
