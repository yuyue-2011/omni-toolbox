name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: 语法 / 终检 / 站点一致性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 以下脚本只用 Node 内置模块（fs / path / child_process），无需安装依赖
      - name: 全部 JS 语法检查（83 个文件）
        run: node scripts/check.js

      - name: 交付前终检（版本 / 计数 / 文档 / 图标 / www 一致性）
        run: node scripts/release-check.js

      - name: 站点去重与「国内优先」排序
        run: node scripts/sites-final-test.js

  # 渲染与交互测试（smoke / deep / game / ui-fix 等）依赖 jsdom 与 file:// 资源加载：
  # static-check 在 Linux runner 上会卡在 resources: 'usable' 长时间不返回，
  # 因此暂不放进 CI，改在本地执行：npm test
